spring.application.name=backend
server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/evchargehub}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-string-at-least-32-chars}
app.jwt.expiration-ms=86400000
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

management.endpoints.web.exposure.include=health